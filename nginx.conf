server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — 所有未匹配的 path 退回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源 cache
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存(便于部署即生效)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}